<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>猫姬 · 阅读循环</title>
<style>body{font:16px system-ui;color:#44372c;background:#eee7db;margin:24px}main{display:flex;gap:20px;flex-wrap:wrap}article{padding:16px;background:white;border-radius:12px}img{background:#f7f4ee;max-width:100%}button,select{padding:8px;font:inherit;margin:4px}p{max-width:780px}</style>
<h1>番茄钟 · 阅读循环</h1><p>沿用已确认的开始动画，整体绘制呼吸、眨眼和翻页。开始动作结束后持续阅读，胸肩、袖口保持轻微呼吸，没有用静止整人帧延长停留。</p>
<main><article><img id="frame" width="448" height="448" src="anime/start/031.png"><p><select id="mode"><option value="all">开始 → 持续阅读</option><option value="reading">只看阅读循环</option><option value="start">只看已确认的开始动画</option></select></p><p><button id="play">播放</button><button id="restart">从头播放</button><button id="prev">上一帧</button><button id="next">下一帧</button><label><input type="checkbox" id="slow">半速</label></p><p id="status"></p><p><a href="reading.gif">阅读循环 GIF</a> · <a href="start-reading.gif">开始接阅读 GIF</a> · <a href="reading-frames.png">全部独立原画</a> · <a href="docs/reading-seams.png">首尾与跨段对照</a> · <a href="READING.md">设计记录</a></p></article>
<article><h2>姿势与细节</h2><img width="600" src="reading-key-poses.png"><p>32张不同透明PNG，约5.86秒一轮；轻微呼吸、自然眨眼与翻页。开始稿的32张PNG保持不变。</p></article></main>
<script>const start=__START__,reading=__READING__,el=id=>document.getElementById(id);const seq={start:start.frames.map(f=>({...f,path:'anime/start/'+f.file,label:'开始'})),reading:reading.frames.map(f=>({...f,path:'anime/reading/'+f.file,label:'阅读'}))};seq.all=[...seq.start,...seq.reading];let n=0,playing=false,elapsed=0,last=0;const current=()=>seq[el('mode').value];function draw(){const f=current()[n];el('frame').src=f.path;el('status').textContent=f.label+' · '+(n+1)+' / '+current().length+' · '+f.duration_ms+' 毫秒';}function state(v){playing=v;el('play').textContent=v?'暂停':'播放';}function restart(){n=0;elapsed=0;state(true);draw();}el('mode').onchange=()=>{n=0;elapsed=0;state(false);draw();};el('play').onclick=()=>{if(n===current().length-1)n=0;elapsed=0;state(!playing);draw();};el('restart').onclick=restart;for(const [id,d]of [['prev',-1],['next',1]])el(id).onclick=()=>{state(false);n=Math.max(0,Math.min(current().length-1,n+d));elapsed=0;draw();};Promise.all([...new Set(seq.all.map(f=>f.path))].map(path=>new Promise((resolve,reject)=>{const im=new Image();im.onload=resolve;im.onerror=reject;im.src=path;}))).then(()=>{draw();requestAnimationFrame(function tick(now){if(last&&playing){elapsed+=Math.min(now-last,100)*(el('slow').checked?.5:1);while(elapsed>=current()[n].duration_ms){elapsed-=current()[n].duration_ms;if(n===current().length-1){if(el('mode').value==='start'){state(false);elapsed=0;break;}n=el('mode').value==='all'?seq.start.length:0;}else n++;draw();}}last=now;requestAnimationFrame(tick);});}).catch(()=>{el('status').textContent='图片加载失败，请刷新重试。';});</script></html>
