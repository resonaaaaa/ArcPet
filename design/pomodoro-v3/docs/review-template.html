<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>番茄钟 · 开始动画 v3 · 整体重绘</title>
<style>body{font:16px system-ui;color:#44372c;background:#eee7db;margin:24px}main{display:flex;gap:20px;flex-wrap:wrap}article{padding:16px;background:white;border-radius:12px}img{background:#f7f4ee;max-width:100%}button{padding:8px;font:inherit;margin:4px}p{max-width:780px}</style>
<h1>番茄钟 · 开始动画 · 整体重绘</h1><p>仅播放坐下、呼吸、拿书、开书，结束后停住。每帧将猫姬连同桌椅作为完整场景绘制。头颈自然相连，猫姬坐在桌后；逐帧复核身体比例和手、书、桌沿的遮挡。</p>
<p><a href="../pomodoro-reading-v2/review.html">查看新补绘的阅读循环与开始接续</a></p><main><article><img id="frame" width="448" height="448" src="anime/start/000.png"><p><button id="play">播放</button><button id="restart">从头播放</button><button id="prev">上一帧</button><button id="next">下一帧</button><label><input type="checkbox" id="slow">半速</label></p><p id="status"></p><p><a href="start.gif">单次播放 GIF</a> · <a href="start-frames.png">全部逐帧</a> · <a href="README.md">设计记录</a></p></article>
<article><h2>关键姿势</h2><img width="600" src="key-poses.png"></article></main>
<script>const seq=__FRAMES__,el=id=>document.getElementById(id);let n=0,playing=false,elapsed=0,last=0;function draw(){el('frame').src='anime/start/'+seq[n].file;el('status').textContent='第 '+(n+1)+' / '+seq.length+' 帧 · '+seq[n].duration_ms+' 毫秒';}function state(v){playing=v;el('play').textContent=v?'暂停':'播放';}el('play').onclick=()=>{if(n===seq.length-1)n=0;elapsed=0;state(!playing);draw();};el('restart').onclick=()=>{n=0;elapsed=0;state(true);draw();};for(const [id,d]of [['prev',-1],['next',1]])el(id).onclick=()=>{state(false);n=Math.max(0,Math.min(seq.length-1,n+d));elapsed=0;draw();};Promise.all(seq.map(f=>new Promise((resolve,reject)=>{const im=new Image();im.onload=resolve;im.onerror=reject;im.src='anime/start/'+f.file;}))).then(()=>{draw();requestAnimationFrame(function tick(now){if(last&&playing){elapsed+=Math.min(now-last,100)*(el('slow').checked?.5:1);while(elapsed>=seq[n].duration_ms){elapsed-=seq[n].duration_ms;if(n===seq.length-1){state(false);elapsed=0;break;}n++;draw();}}last=now;requestAnimationFrame(tick);});}).catch(()=>{el('status').textContent='图片载入失败，请刷新。';});</script></html>
