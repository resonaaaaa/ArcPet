<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>猫姬 · 尾巴与眨眼过渡修订</title>
<style>body{font:16px system-ui;color:#44372c;background:#eee7db;margin:24px}main{display:flex;gap:20px;flex-wrap:wrap}article{padding:16px;background:white;border-radius:12px}img{background:#f7f4ee;max-width:100%}button,select{padding:8px;font:inherit;margin:4px}p{max-width:800px}</style>
<h1>阅读修订 · 尾巴与眨眼过渡</h1><p>整人补绘翻页时的尾巴，修正眼皮色块，沿用统一校色。翻页手势与原有时序保留。</p><p>以已确认开始末帧作构图和颜色参考。翻页：抬手触碰页角 → 捏住并带过书脊 → 放下松手 → 收手；其间保持轻微呼吸。</p>
<main><article><img id="frame" width="448" height="448" src="../pomodoro-v3/anime/start/031.png"><p><select id="mode"><option value="all">开始 → 持续阅读</option><option value="reading">阅读循环</option><option value="page">只看翻页</option><option value="start">已确认的开始动画</option></select></p><p><button id="play">播放</button><button id="restart">从头播放</button><button id="prev">上一帧</button><button id="next">下一帧</button><label><input type="checkbox" id="slow">半速</label></p><p id="status"></p><p><a href="reading.gif">阅读GIF</a> · <a href="start-reading.gif">开始接阅读GIF</a> · <a href="page.gif">仅翻页GIF</a> · <a href="docs/page-contact.png">翻页逐帧特写</a> · <a href="docs/entry-seam.png">接续与首尾对照</a> · <a href="README.md">设计记录</a></p></article>
<article><h2>关键姿势</h2><img width="600" src="key-poses.png"><p>保留自然呼吸，呼吸短循环会重复播放；独立原画和实际播放位置分别记录。已确认开始的原画与透明帧保持不变。</p></article></main>
<script>const start=__START__,reading=__READING__,el=id=>document.getElementById(id);const seq={start:start.frames.map(f=>({...f,path:'../pomodoro-v3/anime/start/'+f.file,label:'开始'})),reading:reading.frames.map(f=>({...f,path:'anime/reading/'+f.file,label:'阅读'}))};seq.all=[...seq.start,...seq.reading];seq.page=seq.reading.slice(24);let n=0,playing=false,elapsed=0,last=0;const current=()=>seq[el('mode').value];function draw(){const f=current()[n];el('frame').src=f.path;el('status').textContent=f.label+' · 播放位置 '+(n+1)+' / '+current().length+' · '+f.duration_ms+' 毫秒'+(f.asset===undefined?'':' · 原画 '+f.asset);}function state(v){playing=v;el('play').textContent=v?'暂停':'播放';}el('mode').onchange=()=>{n=0;elapsed=0;state(false);draw();};el('play').onclick=()=>{if(n===current().length-1)n=0;elapsed=0;state(!playing);draw();};el('restart').onclick=()=>{n=0;elapsed=0;state(true);draw();};for(const [id,d]of [['prev',-1],['next',1]])el(id).onclick=()=>{state(false);n=Math.max(0,Math.min(current().length-1,n+d));elapsed=0;draw();};Promise.all([...new Set(seq.all.map(f=>f.path))].map(path=>new Promise((resolve,reject)=>{const im=new Image();im.onload=resolve;im.onerror=reject;im.src=path;}))).then(()=>{draw();requestAnimationFrame(function tick(now){if(last&&playing){elapsed+=Math.min(now-last,100)*(el('slow').checked?.5:1);while(elapsed>=current()[n].duration_ms){elapsed-=current()[n].duration_ms;if(n===current().length-1){if(el('mode').value==='start'){state(false);elapsed=0;break;}n=el('mode').value==='all'?seq.start.length:0;}else n++;draw();}}last=now;requestAnimationFrame(tick);});}).catch(()=>{el('status').textContent='图片加载失败，请刷新重试。';});</script></html>
