<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>ArcPet · 拎起、悬挂与落地</title>
<style>body{background:#ede8de;color:#3e352b;font:16px system-ui;margin:24px}main{display:flex;gap:20px;flex-wrap:wrap}article{background:white;padding:16px;border-radius:12px}button,select{font:inherit;margin:4px;padding:6px}img{background:#f7f4ee;max-width:100%}#stage{position:relative;width:384px;max-width:80vw}#stage img{display:block;width:100%}#stage:after{content:'';position:absolute;pointer-events:none;top:92.708%;width:100%;border-bottom:1px dashed #b1a691}</style>
<h1>拖动动作 · 三段预览</h1><p>从站立到拎起，悬挂时摆尾和眨眼，松开后抬手找地、屈膝缓冲、站直。虚线为落地线。</p>
<main><article><div id="stage"><img id="frame" src="anime/lift/000.png" alt="动作帧"></div>
<p><select id="clip"><option value="all">完整流程（悬挂两轮）</option><option value="lift">拎起</option><option value="hold">悬挂循环</option><option value="land">落地</option></select>
<button id="play">暂停</button><button id="step">下一帧</button><label><input type="checkbox" id="slow">半速</label></p><p id="info" aria-live="polite"></p>
<p><a href="preview.gif">完整 GIF</a> · <a href="lift.gif">拎起</a> · <a href="hold.gif">悬挂</a> · <a href="land.gif">落地</a></p></article>
<article><h2>关键姿势</h2><img src="key-poses.png" width="576" alt="关键姿势表"><p><a href="lift-frames.png">拎起逐帧</a> · <a href="hold-frames.png">悬挂逐帧</a> · <a href="land-frames.png">落地逐帧</a> · <a href="README.md">设计记录</a></p></article></main>
<script>
const meta={"lift": {"loop": false, "frame_count": 18, "duration_ms": 740, "frames": [{"file": "000.png", "duration_ms": 60, "source_pose": "idle"}, {"file": "001.png", "duration_ms": 40, "source_pose": ["lift-head", 0]}, {"file": "002.png", "duration_ms": 40, "source_pose": ["lift-head", 1]}, {"file": "003.png", "duration_ms": 40, "source_pose": ["lift-head", 2]}, {"file": "004.png", "duration_ms": 40, "source_pose": ["lift-head", 3]}, {"file": "005.png", "duration_ms": 40, "source_pose": ["lift-head", 4]}, {"file": "006.png", "duration_ms": 40, "source_pose": ["lift-head", 5]}, {"file": "007.png", "duration_ms": 40, "source_pose": ["lift-head", 6]}, {"file": "008.png", "duration_ms": 40, "source_pose": ["lift-head", 7]}, {"file": "009.png", "duration_ms": 40, "source_pose": ["lift-head", 8]}, {"file": "010.png", "duration_ms": 40, "source_pose": ["lift-head", 9]}, {"file": "011.png", "duration_ms": 40, "source_pose": ["lift-head", 10]}, {"file": "012.png", "duration_ms": 40, "source_pose": ["lift-head", 11]}, {"file": "013.png", "duration_ms": 40, "source_pose": ["lift-bridge-head", 0]}, {"file": "014.png", "duration_ms": 40, "source_pose": ["lift-bridge-head", 1]}, {"file": "015.png", "duration_ms": 40, "source_pose": ["lift-bridge-head", 2]}, {"file": "016.png", "duration_ms": 40, "source_pose": ["lift-bridge-head", 3]}, {"file": "017.png", "duration_ms": 40, "source_pose": "anchor"}]}, "hold": {"loop": true, "frame_count": 16, "duration_ms": 1190, "frames": [{"file": "000.png", "duration_ms": 90, "source_pose": 0}, {"file": "001.png", "duration_ms": 80, "source_pose": 1}, {"file": "002.png", "duration_ms": 80, "source_pose": 2}, {"file": "003.png", "duration_ms": 90, "source_pose": 3}, {"file": "004.png", "duration_ms": 90, "source_pose": 4}, {"file": "005.png", "duration_ms": 80, "source_pose": 5}, {"file": "006.png", "duration_ms": 70, "source_pose": 6}, {"file": "007.png", "duration_ms": 40, "source_pose": 7}, {"file": "008.png", "duration_ms": 50, "source_pose": 8}, {"file": "009.png", "duration_ms": 40, "source_pose": 9}, {"file": "010.png", "duration_ms": 70, "source_pose": 10}, {"file": "011.png", "duration_ms": 80, "source_pose": 11}, {"file": "012.png", "duration_ms": 90, "source_pose": 12}, {"file": "013.png", "duration_ms": 90, "source_pose": 13}, {"file": "014.png", "duration_ms": 80, "source_pose": 14}, {"file": "015.png", "duration_ms": 70, "source_pose": 15}]}, "land": {"loop": false, "frame_count": 21, "duration_ms": 1040, "frames": [{"file": "000.png", "duration_ms": 40, "source_pose": "anchor"}, {"file": "001.png", "duration_ms": 40, "source_pose": 0}, {"file": "002.png", "duration_ms": 40, "source_pose": 1}, {"file": "003.png", "duration_ms": 40, "source_pose": 2}, {"file": "004.png", "duration_ms": 40, "source_pose": 3}, {"file": "005.png", "duration_ms": 40, "source_pose": 4}, {"file": "006.png", "duration_ms": 40, "source_pose": 5}, {"file": "007.png", "duration_ms": 40, "source_pose": 6}, {"file": "008.png", "duration_ms": 40, "source_pose": 7}, {"file": "009.png", "duration_ms": 60, "source_pose": 8}, {"file": "010.png", "duration_ms": 40, "source_pose": 9}, {"file": "011.png", "duration_ms": 40, "source_pose": 10}, {"file": "012.png", "duration_ms": 40, "source_pose": ["land-bridge", 0]}, {"file": "013.png", "duration_ms": 40, "source_pose": ["land-bridge", 1]}, {"file": "014.png", "duration_ms": 40, "source_pose": ["land-bridge", 2]}, {"file": "015.png", "duration_ms": 40, "source_pose": 11}, {"file": "016.png", "duration_ms": 40, "source_pose": 12}, {"file": "017.png", "duration_ms": 40, "source_pose": 13}, {"file": "018.png", "duration_ms": 40, "source_pose": 14}, {"file": "019.png", "duration_ms": 40, "source_pose": 15}, {"file": "020.png", "duration_ms": 220, "source_pose": "idle"}]}};
const el=id=>document.getElementById(id);
const seq={};
for(const [name,clip] of Object.entries(meta)){
  seq[name]=clip.frames.map((f,i)=>({path:'anime/'+name+'/'+f.file,ms:f.duration_ms,name,index:i+1,total:clip.frame_count}));
}
seq.all=[...seq.lift,...seq.hold,...seq.hold,...seq.land];
const imgs=Object.values(seq).flat().map(f=>f.path);
let t=0,prev=0,n=0,playing=true,ready=false;
const names={lift:'拎起',hold:'悬挂',land:'落地'};
const current=()=>seq[el('clip').value];
const draw=()=>{const f=current()[n];el('frame').src=f.path;el('info').textContent=names[f.name]+' · '+f.index+'/'+f.total+' 帧';};
function state(x){playing=x;el('play').textContent=x?'暂停':'播放';}
el('clip').onchange=()=>{n=0;t=0;state(true);draw();};
el('play').onclick=()=>{if(!playing && n===current().length-1 && ['lift','land'].includes(el('clip').value))n=0;state(!playing);t=0;draw();};
el('step').onclick=()=>{state(false);n=(n+1)%current().length;t=0;draw();};
function tick(now){const a=current();
 if(ready && playing && prev){t+=Math.min(100,now-prev)*(el('slow').checked ? 0.5 : 1);
 while(t>=a[n].ms){t-=a[n].ms;if(n===a.length-1 && ['lift','land'].includes(el('clip').value)){state(false);t=0;break;}n=(n+1)%a.length;draw();}}
 prev=now;requestAnimationFrame(tick);}
Promise.all([...new Set(imgs)].map(src=>new Promise(resolve=>{const i=new Image();i.onload=resolve;i.onerror=resolve;i.src=src;}))).then(()=>{ready=true;draw();requestAnimationFrame(tick);});
</script></html>
