<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>猫姬 · 结束第二段</title>
<style>body{font:16px system-ui;margin:28px auto;max-width:1050px;background:#f7f4ee;color:#44372c}button,select{font:inherit;padding:8px;margin:4px}canvas{max-width:100%;border:1px solid #ccbda9;border-radius:12px}small{display:block}input{width:95%}a{color:#77583c}.row{display:flex;flex-wrap:wrap;gap:12px}</style>
<h1>掏番茄 → 投向镜头 → 番茄酱淡出 → 待机</h1><p>仅美术预览：完整角色动作与飞行/酱料效果分别绘制，遮满镜头后切回正式待机。未接入程序。</p><select id="mode"><option value="only">第二段 → 待机循环</option><option value="full">第一段 → 第二段 → 待机循环</option></select><button id="play">暂停</button><button id="reset">重播</button><button id="prev">上一帧</button><button id="next">下一帧</button><select id="speed"><option value="1">正常速度</option><option value="0.5">半速</option></select><select id="bg"><option value="#f7f4ee">浅底</option><option value="#242832">深底</option><option value="#4f78a0">蓝底</option></select><div class="row"><div><canvas id="canvas" width="448" height="448"></canvas><small id="label"></small></div><div><p>已确认阅读形象</p><img src="../pomodoro-reading-v3/anime/reading/000.png" width="448" alt="已确认阅读"></div></div><input id="seek" type="range" min="0" value="0">
<p><a href="all-frames.png">全部帧</a> · <a href="docs/release-flight.png">出手与飞行</a> · <a href="docs/actor-seams.png">阶段衔接</a> · <a href="docs/prompt-set.json">内置绘图记录</a></p>
<script>const clips=__CLIPS__;const el=id=>document.getElementById(id),ctx=el('canvas').getContext('2d');let seq=[],loopAt=0,index=0,run=true,elapsed=0,last=0,ready=false;const cache={};
async function prepare(){await Promise.all([...new Set(Object.values(clips).flat().map(f=>f.src))].map(src=>new Promise((resolve,reject)=>{const im=new Image();cache[src]=im;im.onload=resolve;im.onerror=reject;im.src=src;})));ready=true;reset();requestAnimationFrame(tick);}
function reset(){seq=[...(el('mode').value==='full'?clips.part1:[]),...clips.end,...clips.idle];loopAt=seq.length-clips.idle.length;index=0;elapsed=0;last=0;el('seek').max=seq.length-1;draw();}
function draw(){if(!ready)return;let f=seq[index];ctx.fillStyle=el('bg').value;ctx.fillRect(0,0,448,448);ctx.drawImage(cache[f.src],0,0);el('label').textContent=f.label+' · '+f.ms+'ms';el('seek').value=index;el('play').textContent=run?'暂停':'继续播放';}
function tick(t){if(last&&run){elapsed+=Math.min(t-last,150)*Number(el('speed').value);while(elapsed>=seq[index].ms&&run){elapsed-=seq[index].ms;if(index+1<seq.length)index++;else if(loopAt>=0)index=loopAt;else{run=false;elapsed=0;}}}last=t;draw();requestAnimationFrame(tick);}
el('mode').onchange=()=>{run=true;reset();};el('reset').onclick=()=>{run=true;reset();};el('play').onclick=()=>{run=!run;draw();};el('prev').onclick=()=>{run=false;index=Math.max(0,index-1);elapsed=0;draw();};el('next').onclick=()=>{run=false;index=Math.min(seq.length-1,index+1);elapsed=0;draw();};el('seek').oninput=()=>{run=false;index=Number(el('seek').value);elapsed=0;draw();};el('bg').onchange=draw;prepare().catch(()=>el('label').textContent='图片加载失败，请保持完整目录');</script></html>
