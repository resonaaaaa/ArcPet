<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>ArcPet 散步 · 直立与步态修订</title>
<style>body{font:16px system-ui;background:#ede8de;color:#3e352b;margin:28px}main{display:flex;gap:20px;flex-wrap:wrap}article{background:white;padding:18px;border-radius:12px}img.pet{width:320px;height:320px;background:#f7f4ee}button{padding:8px 12px;margin:4px;border:1px solid #b6a58c;border-radius:7px;background:#faf7ef}.proof{max-width:960px;width:100%}</style>
<h1>散步 · 直立与步态修订</h1><p>重新绘制直立关键姿势与完整循环：缩短跨步、保持支撑重心，复查近远腿经过和遮挡。衣发保持轻微动态。首尾高度已微调；30帧，1.20秒循环，仅设计预览。</p>
<main><article><h2>当前设计</h2><img class="pet" id="walk" src="anime/000.png?revision=seam1"><p id="status">加载…</p><button id="toggle">暂停</button><button id="speed">慢放 ×0.5</button><button id="step">下一帧</button><p><a href="preview.gif">GIF</a> · <a href="preview.webp">WebP</a> · <a href="frames-contact.png">全部帧</a></p></article><article><h2>动作参考</h2><img src="../walk-v1/reference/walk.gif" style="height:270px"><p>仅参考表情和步态，服装沿用现有猫姬。</p></article></main>
<h2>步态关键姿势</h2><img class="proof" src="gait-proof.png"><h2>全部30帧腿部放大</h2><a href="legs-detail.png"><img class="proof" src="legs-detail.png"></a><h2>比例与落地线</h2><img class="proof" src="size-comparison.png"><p><a href="posture-comparison.png">前倾修订对照</a> · <a href="README.md">设计记录及限制</a></p>
<script>let index=0,playing=true,slow=false,last=0,elapsed=0;const images=[],target=document.getElementById('walk'),status=document.getElementById('status');function render(){target.src=images[index].src;status.textContent=`第 ${index+1}/30 帧`};document.getElementById('toggle').onclick=()=>{playing=!playing;elapsed=0;document.getElementById('toggle').textContent=playing?'暂停':'播放'};document.getElementById('speed').onclick=()=>{slow=!slow;elapsed=0;document.getElementById('speed').textContent=slow?'正常 ×1':'慢放 ×0.5'};document.getElementById('step').onclick=()=>{playing=false;elapsed=0;document.getElementById('toggle').textContent='播放';index=(index+1)%30;render()};Promise.all(Array.from({length:30},(_,i)=>new Promise((resolve,reject)=>{const im=new Image();images.push(im);im.onload=resolve;im.onerror=reject;im.src=`anime/${String(i).padStart(3,'0')}.png?revision=seam1`}))).then(()=>{render();requestAnimationFrame(function tick(t){if(last&&playing){elapsed+=Math.min(t-last,200);let duration=slow?80:40;if(elapsed>=duration){const n=Math.floor(elapsed/duration);index=(index+n)%30;elapsed-=n*duration;render()}}last=t;requestAnimationFrame(tick)})}).catch(()=>status.textContent='加载失败，请查看GIF');</script></html>
